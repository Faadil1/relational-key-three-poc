name: V2 React R3F Pilot CI

on:
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2-app/**'
      - 'V2/**'
      - '.github/workflows/v2-react-r3f-pilot-ci.yml'
  pull_request:
    paths:
      - 'v2-app/**'
      - 'V2/**'
      - '.github/workflows/v2-react-r3f-pilot-ci.yml'

permissions:
  contents: write

jobs:
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-app/package-lock.json

      - name: Materialize exact lockfile
        working-directory: v2-app
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install locked graph
        working-directory: v2-app
        run: npm ci --ignore-scripts

      - name: Security audit
        working-directory: v2-app
        run: npm audit --audit-level=high

      - name: Relational contract + production build
        working-directory: v2-app
        run: npm run check

      - name: Report bounded bundle sizes
        working-directory: v2-app
        shell: bash
        run: |
          find dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit lockfile if first materialization changed it
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- v2-app/package-lock.json; then
            echo 'package-lock already canonical'
            exit 0
          fi
          git config user.name 'relational-key-v2-ci'
          git config user.email 'relational-key-v2-ci@users.noreply.github.com'
          git add v2-app/package-lock.json
          git commit -m 'chore(v2): lock React R3F pilot dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}

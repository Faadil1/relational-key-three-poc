name: V2 React R3F Pilot CI

on:
  push:
    branches:
      - 'v2/**'
      - 'preview/**'
    paths:
      - 'v2-app/**'
      - 'V2/**'
      - 'README.md'
      - 'vercel.json'
      - '.github/workflows/v2-react-r3f-pilot-ci.yml'
  pull_request:
    paths:
      - 'v2-app/**'
      - 'V2/**'
      - 'README.md'
      - 'vercel.json'
      - '.github/workflows/v2-react-r3f-pilot-ci.yml'

permissions:
  contents: write

jobs:
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify V2 production packaging contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const expected = {
            installCommand: 'cd v2-app && npm ci --ignore-scripts',
            buildCommand: 'cd v2-app && npm run build',
            outputDirectory: 'v2-app/dist',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (config[key] !== value) throw new Error(`${key} mismatch: ${config[key]} !== ${value}`);
          }
          const deployment = config.git?.deploymentEnabled || {};
          if (deployment['**'] !== false || deployment.main !== true || deployment['preview/**'] !== true || deployment['preview-*'] !== true) {
            throw new Error('Vercel deployment-budget default-deny contract changed');
          }
          console.log('V2 production packaging contract: PASS');
          NODE

      - name: Materialize exact lockfile
        working-directory: v2-app
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install locked graph
        working-directory: v2-app
        run: npm ci --ignore-scripts

      - name: Security audit
        working-directory: v2-app
        run: npm audit --audit-level=high

      - name: Relational contract + production build
        working-directory: v2-app
        run: npm run check

      - name: Verify packaged output exists
        shell: bash
        run: |
          test -f v2-app/dist/index.html
          test -d v2-app/dist/assets
          echo 'Packaged V2 output: PASS'

      - name: Report bounded bundle sizes
        working-directory: v2-app
        shell: bash
        run: |
          find dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit lockfile if first materialization changed it
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v2/')
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- v2-app/package-lock.json)" ]; then
            echo 'package-lock already canonical'
            exit 0
          fi
          git config user.name 'relational-key-v2-ci'
          git config user.email 'relational-key-v2-ci@users.noreply.github.com'
          git add v2-app/package-lock.json
          git commit -m 'chore(v2): lock React R3F pilot dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}

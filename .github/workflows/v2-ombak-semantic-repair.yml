name: V2 Ombak Semantic Repair Helper

on:
  push:
    branches:
      - 'v2/archive-interaction-3d-matrix-001'
    paths:
      - '.github/workflows/v2-ombak-semantic-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Ombak V1→V2 semantic repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('v2-app/src/App.jsx'): [
                  (
                      "const effectiveOmbakDifference = matching ? ombakDifference : Math.max(0.25, ombakDifference * 0.18);",
                      "const effectiveOmbakDifference = matching ? ombakDifference : Math.min(20, ombakDifference + 5);",
                  ),
                  (
                      ": 'OTHER READY · sources remain independently valid; selected relation is intentionally outside the matching study state.';",
                      ": `OTHER READY · synthetic paired sources differ by ${effectiveOmbakDifference.toFixed(1)} Hz · outside the matching study state.`;",
                  ),
              ],
              Path('v2-app/src/scenes/OmbakScene.jsx'): [
                  (
                      "const effectiveDifference = matching ? differenceHz : Math.max(0.25, differenceHz * 0.18);",
                      "const effectiveDifference = matching ? differenceHz : Math.min(20, differenceHz + 5);",
                  ),
              ],
              Path('v2-app/qa/runtime-compare.mjs'): [
                  (
                      "otherExpect: /OTHER .*study difference/i,",
                      "otherExpect: /OTHER .*12\\.0 Hz/i,",
                  ),
              ],
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          if len(changed) != 3:
              raise SystemExit(f'expected exactly 3 changed files, got {changed}')
          print('bounded repair:', ', '.join(changed))
          PY

          git diff --check
          git diff -- v2-app/src/App.jsx v2-app/src/scenes/OmbakScene.jsx v2-app/qa/runtime-compare.mjs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'relational-key-v2-ci'
          git config user.email 'relational-key-v2-ci@users.noreply.github.com'
          git add v2-app/src/App.jsx v2-app/src/scenes/OmbakScene.jsx v2-app/qa/runtime-compare.mjs
          git commit -m 'fix(v2): preserve Ombak OTHER relation from V1'
          git push origin HEAD:${GITHUB_REF_NAME}

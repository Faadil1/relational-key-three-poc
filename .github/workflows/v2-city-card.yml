name: V2 Collectible City Card Verification
on:
  push:
    branches: ['v2/**', 'preview/**']
    paths: ['v2-app/**', '.github/workflows/v2-city-card.yml']
permissions:
  contents: read
jobs:
  city-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and build
        working-directory: v2-app
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium
      - name: Verify rendered pair
        working-directory: v2-app
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist > /tmp/rk-holo-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          node qa/city-card.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-city-card
          path: v2-app/city-evidence/
          retention-days: 14

name: V2 Exact Browser Runtime Compare

on:
  push:
    branches:
      - 'v2/**'
    paths:
      - 'v2-app/**'
      - '.github/workflows/v2-runtime-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-app/package-lock.json

      - name: Install exact V2 graph
        working-directory: v2-app
        run: npm ci --ignore-scripts

      - name: Build V2 production bundle
        working-directory: v2-app
        run: npm run build

      - name: Install bounded browser harness
        working-directory: v2-app
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Start local V1 and V2 servers
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/rk-v1-http.log 2>&1 &
          echo $! > /tmp/rk-v1-http.pid
          python3 -m http.server 4174 --bind 127.0.0.1 --directory v2-app/dist > /tmp/rk-v2-http.log 2>&1 &
          echo $! > /tmp/rk-v2-http.pid
          for port in 4173 4174; do
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Run V1 vs V2 exact-browser + scaling gates
        working-directory: v2-app
        env:
          RK_V1_URL: http://127.0.0.1:4173
          RK_V2_URL: http://127.0.0.1:4174
          RK_RUNTIME_OUT: runtime-evidence
        run: |
          node qa/runtime-compare.mjs
          node qa/focus-capture.mjs
          cp dist/scaling-architecture.json runtime-evidence/scaling-architecture-build.json
          node qa/scaling-architecture.mjs
          node qa/wave003-compare.mjs
          node qa/wave004-compare.mjs
          node qa/all15-chunk-isolation.mjs

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-key-v2-runtime-compare
          path: v2-app/runtime-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Show local server logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- V1 server ---'
          cat /tmp/rk-v1-http.log || true
          echo '--- V2 server ---'
          cat /tmp/rk-v2-http.log || true

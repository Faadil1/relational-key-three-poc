<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RELATIONAL KEY — Khipu G4.1 Polish Candidate</title>
<style>
:root{--bg:#0b0b09;--ink:#eee8dc;--muted:#7e776b;--line:rgba(235,221,194,.14);--warm:#c9a66d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink)}body{display:grid;grid-template-rows:44px minmax(0,1fr);overflow:hidden}.framebar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(11,11,9,.96);min-width:0}.back{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;color:#d8bd8d;text-decoration:none;font:800 7px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;white-space:nowrap}.back:hover{border-color:rgba(201,166,109,.45);background:rgba(201,166,109,.07)}.context{min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 6px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:var(--muted)}.law{font:800 6px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#6f685d;white-space:nowrap}.frame{width:100%;height:100%;border:0;background:#0d0e0c;display:block}@media(max-width:680px){body{grid-template-rows:42px minmax(0,1fr)}.framebar{grid-template-columns:auto 1fr;padding:0 9px}.context{text-align:right}.law{display:none}.back{padding:0 9px;font-size:6px}}
</style>
</head>
<body>
<nav class="framebar" aria-label="Collection navigation">
  <a class="back" href="/#grid">← BACK TO ATLAS</a>
  <div class="context">PERU · KNOTTED REGISTER · G4.1 POLISH CANDIDATE</div>
  <div class="law">THE PAIR IS THE PRODUCT</div>
</nav>
<iframe class="frame" id="rk" title="Peru · Knotted Register G4.1 polish candidate" src="/families/khipu-peru/snapshot.html"></iframe>
<script>
const frame=document.getElementById('rk');
frame.onload=()=>{
  try{
    const doc=frame.contentWindow.document;
    const style=doc.createElement('style');
    style.id='g4-1-khipu-polish';
    style.textContent=`
      /* G4.1: relation-legibility only. No timing, state or semantic changes. */
      .tensionCord{opacity:.12;transition:opacity .55s ease,filter .55s ease}
      .tensionCord:before,.tensionCord:after{height:5px;background:linear-gradient(#d1ad78,#795338);box-shadow:0 1px 0 rgba(255,255,255,.08)}
      .pair[data-phase="approach"] .tensionCord{opacity:.42}
      .pair[data-phase="tension"] .tensionCord{opacity:1;filter:brightness(1.14) drop-shadow(0 0 5px rgba(190,142,83,.28))}
      .pair[data-phase="registered"] .tensionCord{opacity:.88;filter:brightness(1.06)}

      .knotCore{width:68px;height:68px;opacity:.30}
      .knotCore .loop{width:34px;height:20px;border-width:5px;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.28)}
      .knotCore .loop:after{left:12px;top:-13px;width:9px;height:39px}
      .knotCore .ring{inset:4px;border-color:rgba(207,166,108,.34)}
      .pair[data-phase="tension"] .knotCore{opacity:.88;transform:scale(1.08);filter:drop-shadow(0 0 7px rgba(190,142,83,.18))}
      .pair[data-phase="registered"] .knotCore{opacity:1;transform:scale(.86) rotate(-18deg);filter:drop-shadow(0 0 6px rgba(190,142,83,.20))}
      .pair[data-phase="rejected"] .knotCore{opacity:.08;filter:none}

      @media(max-width:920px){
        .knotCore{width:64px;height:64px}
        .tensionCord:before,.tensionCord:after{width:5px}
      }
    `;
    doc.head.appendChild(style);
  }catch(e){console.error('G4.1 Khipu polish injection failed',e)}
};
</script>
</body>
</html>

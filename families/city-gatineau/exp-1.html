<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RELATIONAL KEY — Gatineau EXP-1 Route Handoff Candidate</title>
<style>
:root{--bg:#0b0b09;--ink:#eee8dc;--muted:#7e776b;--line:rgba(235,221,194,.14);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink)}body{display:grid;grid-template-rows:44px minmax(0,1fr);overflow:hidden}.framebar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(11,11,9,.96);min-width:0}.back{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;color:#d8bd8d;text-decoration:none;font:800 7px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;white-space:nowrap}.context{min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 6px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:var(--muted)}.law{font:800 6px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#6f685d;white-space:nowrap}.frame{width:100%;height:100%;border:0;background:#0d0e0c;display:block}@media(max-width:680px){body{grid-template-rows:42px minmax(0,1fr)}.framebar{grid-template-columns:auto 1fr;padding:0 9px}.context{text-align:right}.law{display:none}.back{padding:0 9px;font-size:6px}}
</style>
</head>
<body>
<nav class="framebar" aria-label="Collection navigation">
  <a class="back" href="/#grid">← BACK TO ATLAS</a>
  <div class="context">GATINEAU · REGISTERED CITY PASSAGE · EXP-1 ROUTE HANDOFF</div>
  <div class="law">THE PAIR IS THE PRODUCT</div>
</nav>
<iframe class="frame" id="rk" title="Gatineau · Registered City Passage EXP-1 candidate" src="/families/_shared/round13r/index.html"></iframe>
<script>
const frame=document.getElementById('rk');
frame.onload=()=>{
  try{
    const doc=frame.contentWindow.document;
    const win=frame.contentWindow;
    const cityTab=doc.querySelector('[data-e="city"]');
    cityTab?.click();

    const activate=()=>{
      const pair=doc.getElementById('pair');
      const leftCard=doc.querySelector('.leftCard');
      const rightCard=doc.querySelector('.rightCard');
      const bridge=doc.querySelector('.bridge');
      const run=doc.getElementById('run');
      const reset=doc.getElementById('reset');
      const claimButtons=[...doc.querySelectorAll('[data-claim]')];
      if(!pair||!leftCard||!rightCard||!bridge||!run) return;

      doc.body.classList.add('city-expansion');
      pair.dataset.cityExp='idle';

      const style=doc.createElement('style');
      style.id='exp-1-city-route-handoff';
      style.textContent=`
        /* EXP-1 City: route continuation becomes pair-spanning and spatial. */
        .city-expansion .junction{opacity:.24;transform:scale(.78);transition:opacity .45s,transform .45s,box-shadow .45s}
        .city-expansion .pair[data-city-exp="registered"] .junction{opacity:.34;transform:scale(.82)}
        .city-expansion .pair[data-city-exp="other"] .junction{opacity:.18}
        .city-expansion .bridgeLabel{top:calc(50% + 39px);color:#78879b}

        .cityExpCardRoute{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.42;transition:opacity .55s,transform .7s cubic-bezier(.2,.8,.2,1),filter .55s}
        .cityExpCardRoute svg{width:100%;height:100%;overflow:visible}
        .cityExpCardRoute path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
        .cityExpCardRoute.left path{stroke:#4d9cff;filter:drop-shadow(0 0 7px rgba(77,156,255,.28))}
        .cityExpCardRoute.right path{stroke:#ef7659;filter:drop-shadow(0 0 7px rgba(239,118,89,.24))}
        .cityExpCardRoute circle{stroke-width:2;fill:#121821}
        .cityExpCardRoute.left circle{stroke:#69adff}
        .cityExpCardRoute.right circle{stroke:#f08b73}
        .pair[data-city-exp="approach"] .cityExpCardRoute{opacity:.75;filter:brightness(1.08)}
        .pair[data-city-exp="registered"] .cityExpCardRoute{opacity:1;filter:brightness(1.18)}
        .pair[data-city-exp="registered"] .cityExpCardRoute path{stroke-width:4}
        .pair[data-city-exp="other"] .cityExpCardRoute{opacity:.92}
        .pair[data-city-exp="other"] .cityExpCardRoute.left{transform:translateY(-11px)}
        .pair[data-city-exp="other"] .cityExpCardRoute.right{transform:translateY(12px)}

        .cityExpBridge{position:absolute;left:-3%;right:-3%;top:50%;height:76px;transform:translateY(-50%);z-index:9;pointer-events:none;overflow:visible}
        .cityExpContinuous,.cityExpSplitA,.cityExpSplitB{position:absolute;border-radius:999px;opacity:0;transition:opacity .45s,transform .65s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
        .cityExpContinuous{left:0;right:0;top:37px;height:4px;background:linear-gradient(90deg,#4d9cff 0%,#89c1ff 42%,#efc0a7 58%,#ef7659 100%);transform:scaleX(.12);box-shadow:0 0 16px rgba(112,166,240,.22)}
        .cityExpSplitA{left:0;width:43%;top:24px;height:3px;background:linear-gradient(90deg,#4d9cff,#7eb6ff);transform:translateX(-3px)}
        .cityExpSplitB{right:0;width:43%;top:50px;height:3px;background:linear-gradient(90deg,#ef9a83,#ef7659);transform:translateX(3px)}
        .cityExpPulse{position:absolute;width:10px;height:10px;border-radius:50%;top:34px;left:0;background:#f5efe5;border:2px solid #8cc1ff;box-shadow:0 0 18px rgba(118,178,255,.9);opacity:0}
        .cityExpState{position:absolute;left:50%;top:57px;transform:translateX(-50%);font:800 5px ui-monospace,monospace;letter-spacing:.11em;color:#7890a5;white-space:nowrap;opacity:0;transition:opacity .35s}

        .pair[data-city-exp="approach"] .cityExpContinuous{opacity:.35;transform:scaleX(.5)}
        .pair[data-city-exp="registered"] .cityExpContinuous{opacity:1;transform:scaleX(1);box-shadow:0 0 20px rgba(112,166,240,.42)}
        .pair[data-city-exp="registered"] .cityExpPulse{opacity:1;animation:cityHandoff 1.45s cubic-bezier(.2,.7,.2,1) infinite}
        .pair[data-city-exp="registered"] .cityExpState{opacity:1}
        .pair[data-city-exp="registered"] .cityExpState:after{content:'ROUTE HANDOFF · CONTINUOUS'}
        .pair[data-city-exp="other"] .cityExpSplitA,.pair[data-city-exp="other"] .cityExpSplitB{opacity:1;transform:translateX(0);box-shadow:0 0 12px rgba(120,150,190,.18)}
        .pair[data-city-exp="other"] .cityExpState{opacity:1;color:#9b7d78}
        .pair[data-city-exp="other"] .cityExpState:after{content:'OFFSET RESIDUAL · BOTH ROUTES VALID'}

        @keyframes cityHandoff{
          0%{left:0;transform:scale(.72);opacity:.25}
          14%{opacity:1}
          50%{transform:scale(1.1)}
          86%{opacity:1}
          100%{left:calc(100% - 10px);transform:scale(.72);opacity:.22}
        }

        @media(max-width:900px){
          .cityExpCardRoute{display:none}
          .cityExpBridge{left:50%;right:auto;top:0;bottom:0;width:70px;height:100%;transform:translateX(-50%)}
          .cityExpContinuous{left:33px;right:auto;top:0;bottom:0;width:4px;height:auto;transform:scaleY(.12)}
          .pair[data-city-exp="approach"] .cityExpContinuous{transform:scaleY(.5)}
          .pair[data-city-exp="registered"] .cityExpContinuous{transform:scaleY(1)}
          .cityExpPulse{left:30px;top:0}
          .pair[data-city-exp="registered"] .cityExpPulse{animation:cityHandoffNarrow 1.45s cubic-bezier(.2,.7,.2,1) infinite}
          .cityExpSplitA{left:21px;top:0;width:3px;height:42%}
          .cityExpSplitB{right:21px;top:auto;bottom:0;width:3px;height:42%}
          .cityExpState{top:50%;left:78px;transform:translateY(-50%);writing-mode:vertical-rl}
          @keyframes cityHandoffNarrow{0%{top:0;opacity:.25}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 10px);opacity:.22}}
        }
      `;
      doc.head.appendChild(style);

      const leftRoute=doc.createElement('div');
      leftRoute.className='cityExpCardRoute left';
      leftRoute.innerHTML='<svg viewBox="0 0 300 160" preserveAspectRatio="none" aria-hidden="true"><path d="M18 109 C70 77 128 115 182 89 S258 69 300 80"/><circle cx="298" cy="80" r="5"/></svg>';
      leftCard.appendChild(leftRoute);

      const rightRoute=doc.createElement('div');
      rightRoute.className='cityExpCardRoute right';
      rightRoute.innerHTML='<svg viewBox="0 0 300 160" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80 C48 70 94 59 141 78 S228 99 282 65"/><circle cx="2" cy="80" r="5"/></svg>';
      rightCard.appendChild(rightRoute);

      const bridgeLayer=doc.createElement('div');
      bridgeLayer.className='cityExpBridge';
      bridgeLayer.innerHTML='<i class="cityExpContinuous"></i><i class="cityExpSplitA"></i><i class="cityExpSplitB"></i><i class="cityExpPulse"></i><span class="cityExpState"></span>';
      bridge.appendChild(bridgeLayer);

      let timer=0;
      const setStage=(stage)=>{pair.dataset.cityExp=stage};
      const activeClaim=()=>doc.querySelector('[data-claim].active')?.dataset.claim || 'matching';
      claimButtons.forEach(btn=>btn.addEventListener('click',()=>{clearTimeout(timer);setStage('idle')}));
      reset?.addEventListener('click',()=>{clearTimeout(timer);setStage('idle')});
      run.addEventListener('click',()=>{
        clearTimeout(timer);
        const claim=activeClaim();
        setStage('approach');
        timer=win.setTimeout(()=>setStage(claim==='matching'?'registered':'other'),620);
      });
    };

    win.setTimeout(activate,80);
  }catch(e){console.error('EXP-1 City route handoff injection failed',e)}
};
</script>
</body>
</html>

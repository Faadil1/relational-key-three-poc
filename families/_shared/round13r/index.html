<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELATIONAL KEY — Pair Restoration</title><style>:root{--bg:#0d0e0c;--ink:#f2eee4;--muted:#918879;--line:rgba(226,199,147,.17);--a:#d7ae62;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(150,113,50,.15),transparent 32%),var(--bg);color:var(--ink)}button{font:inherit}.shell{min-height:100vh;padding:14px clamp(14px,2vw,36px) 24px}.top{min-height:64px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;border-bottom:1px solid var(--line);gap:16px}.brand{font:700 9px ui-monospace,monospace;letter-spacing:.19em;color:#e0bd78}.head{text-align:center}.head b{font:600 21px Georgia,serif}.head small,.meta{display:block;font:600 6px ui-monospace,monospace;letter-spacing:.13em;color:#857866}.tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0}.tabs button,.controls button{border:1px solid rgba(220,180,104,.2);background:#151711;color:#8e8475;min-height:38px;padding:0 12px;font:700 6px ui-monospace,monospace;letter-spacing:.08em;cursor:pointer}.tabs .active,.controls .active{border-color:#cda35d;color:#f0cf8b;background:rgba(187,135,53,.12)}.intro{text-align:center;margin:23px 0 17px}.intro span{font:700 6px ui-monospace,monospace;letter-spacing:.15em;color:#8c7958}.intro h1{font:600 clamp(28px,3vw,42px) Georgia,serif;margin:7px 0 4px}.intro p{margin:0;font:italic 12px Georgia,serif;color:#9b907e}.pair{width:min(1240px,100%);margin:auto;display:grid;grid-template-columns:1fr 145px 1fr;align-items:center;gap:14px}.wrap{transition:.7s cubic-bezier(.2,.8,.2,1)}.pair[data-phase=approach] .left{transform:translateX(20px)}.pair[data-phase=approach] .right{transform:translateX(-20px)}.pair[data-phase=registered] .left{transform:translateX(12px)}.pair[data-phase=registered] .right{transform:translateX(-12px)}.card{aspect-ratio:856/540;border-radius:26px;overflow:hidden;position:relative;background:#151610;border:1px solid rgba(236,211,162,.18);box-shadow:0 34px 60px rgba(0,0,0,.42);isolation:isolate}.material{position:absolute;inset:0;overflow:hidden}.material img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,6,.72),rgba(7,8,6,.08) 64%),linear-gradient(180deg,transparent 52%,rgba(4,5,4,.52));z-index:3}.role{position:absolute;z-index:6;left:5%;top:6%;font:700 6px ui-monospace,monospace;letter-spacing:.13em;padding:6px 8px;border-radius:999px;background:rgba(8,9,7,.55);color:#e7d8bb}.copy{position:absolute;z-index:6;left:6%;bottom:8%;text-shadow:0 2px 14px #000}.copy span{font:700 6px ui-monospace,monospace;letter-spacing:.12em;color:#ddb66d}.copy strong{display:block;font:600 clamp(20px,2.2vw,32px) Georgia,serif;margin-top:3px}.copy small{display:block;margin-top:6px;font:600 6px ui-monospace,monospace;letter-spacing:.08em;color:#b4aa99}.bridge{height:150px;display:grid;place-items:center;position:relative}.bridge:before,.bridge:after{content:"";position:absolute;top:50%;height:1px;width:42%;background:linear-gradient(90deg,transparent,rgba(219,177,100,.36))}.bridge:before{left:0}.bridge:after{right:0;transform:rotate(180deg)}.junction{width:42px;height:42px;border:1px solid rgba(224,181,100,.45);border-radius:50%;background:#11120e;position:relative;z-index:3}.junction:before,.junction:after{content:"";position:absolute;background:#caa15e;left:50%;top:50%;transform:translate(-50%,-50%)}.junction:before{width:1px;height:18px}.junction:after{height:1px;width:18px}.bridgeLabel{position:absolute;top:calc(50% + 31px);font:700 5px ui-monospace,monospace;letter-spacing:.1em;color:#746c60;white-space:nowrap}.conn{position:absolute;left:4%;right:4%;top:50%;height:44px;transform:translateY(-50%);opacity:0;transition:.6s}.pair[data-phase=registered] .conn{opacity:1}.pair[data-phase=registered] .junction{border-color:#ecc779;box-shadow:0 0 0 7px rgba(222,174,84,.06),0 0 27px rgba(222,174,84,.18)}.pair.rejected{animation:recoil .42s ease}@keyframes recoil{0%,100%{transform:translateX(0)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}.city .material{background:#182033}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(73,128,198,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(73,128,198,.2) 1px,transparent 1px);background-size:32px 32px}.route{position:absolute;left:8%;right:7%;top:52%;height:7px;border-radius:8px;background:#327dff;transform:rotate(-7deg)}.cityConn{height:8px;margin-top:18px;border-radius:9px;background:linear-gradient(90deg,#327dff,#ef684d);box-shadow:0 0 18px rgba(55,119,255,.35)}.service .material{background:#ded1b7}.steps{position:absolute;inset:18% 8%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.steps i{display:grid;place-items:center;border:1px solid rgba(63,44,24,.22);background:rgba(255,255,255,.3);color:#553c24;font:700 8px ui-monospace,monospace}.steps .miss{border-style:dashed;background:rgba(177,62,44,.09)}.serviceConn{display:flex;gap:6px;align-items:center;height:44px}.serviceConn i{flex:1;height:16px;border:1px solid rgba(221,176,92,.55);background:rgba(211,157,68,.16)}.signal .material{background:radial-gradient(circle at 65% 48%,rgba(231,137,77,.2),transparent 23%),#111821}.tower{position:absolute;left:64%;top:20%;width:4px;height:60%;background:#e7894d}.tower:before,.tower:after{content:"";position:absolute;left:50%;top:15%;transform:translate(-50%,-50%);border:1px solid rgba(231,137,77,.5);border-radius:50%}.tower:before{width:84px;height:84px}.tower:after{width:126px;height:126px}.signalConn{height:40px;border-top:2px solid #e7894d;border-radius:50%;box-shadow:0 -8px 22px rgba(231,137,77,.2)}.frida .material img{filter:saturate(.82) contrast(1.04)}.fridaConn{height:2px;margin-top:20px;background:linear-gradient(90deg,transparent,#d4a35e 18%,#d4c8ad 50%,#d4a35e 82%,transparent)}.food .material img{filter:saturate(.94) contrast(1.03)}.food .leftCard img{filter:saturate(.75) brightness(.62)}.pressure{position:absolute;left:9%;right:9%;top:48%;height:18px;border-top:1px solid #cfa75f;border-bottom:1px solid #cfa75f;background:rgba(58,44,26,.7);z-index:4}.foodConn{height:18px;margin-top:13px;border-top:1px solid #d3aa62;border-bottom:1px solid #d3aa62;background:linear-gradient(90deg,#4c3820,rgba(209,166,92,.25),#4c3820)}.textile .material{background-image:url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Kente_Cloth_MET_1972.56.1_d1.jpg?width=1600');background-size:cover}.strip{position:absolute;top:-4%;bottom:-4%;width:28%;background-image:url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Kente_Cloth_MET_1972.56.1_d2.jpg?width=1200');background-size:320% 110%;z-index:4;transition:.7s}.leftCard .strip{right:0;background-position:52% center;transform:translateY(17px)}.rightCard .strip{left:0;background-position:54% center;transform:translateY(-13px)}.pair[data-phase=registered].textile .strip{transform:translateY(0)}.textileConn{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:19px}.textileConn i{height:3px;background:#d9aa54}.textileConn i:nth-child(3n){background:#a8392c}.textileConn i:nth-child(4n){background:#2e694d}.controls{width:min(920px,96vw);margin:18px auto 0;display:grid;grid-template-columns:1fr auto auto;gap:7px}.claims{display:flex;gap:6px}.claims button{flex:1}.run{min-width:200px!important;background:linear-gradient(145deg,#b99355,#d5b572)!important;color:#211a11!important;border-color:#c39c5b!important}.result{text-align:center;min-height:28px;margin-top:8px;font:700 6px ui-monospace,monospace;letter-spacing:.1em;color:#81786a}.result.ok{color:#8dc28d}.result.bad{color:#bd8377}.law,.truth{text-align:center;font:600 6px ui-monospace,monospace;letter-spacing:.08em;color:#6f685d}.law{margin-top:8px}.truth{font-size:5px;margin-top:11px}.dots{display:flex;gap:6px;justify-content:center;margin-top:7px}.dots i{width:5px;height:5px;border-radius:50%;background:#474138}.dots i.on{background:#d1aa67}@media(max-width:900px){.pair{grid-template-columns:1fr}.bridge{height:95px}.bridge:before,.bridge:after{width:1px;height:34%;left:50%;right:auto;background:linear-gradient(transparent,rgba(219,177,100,.36))}.bridge:before{top:0}.bridge:after{top:auto;bottom:0;transform:none}.pair[data-phase=approach] .left{transform:translateY(8px)}.pair[data-phase=approach] .right{transform:translateY(-8px)}.pair[data-phase=registered] .left,.pair[data-phase=registered] .right{transform:none}.top{grid-template-columns:auto 1fr}.meta{display:none}.head{text-align:right}.controls{grid-template-columns:1fr 1fr}.claims{grid-column:1/-1}.run{min-width:0!important}}@media(max-width:560px){.brand{font-size:0}.tabs{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.tabs button{flex:0 0 auto}.copy strong{font-size:20px}}</style></head><body><main class="shell"><header class="top"><div class="brand">RELATIONAL KEY</div><div class="head"><small>ROUND 13R · TWO-CARD RESTORATION</small><b>Relational Pair</b></div><div class="meta">6 VARIANTS<br>ONE INVARIANT</div></header><nav class="tabs" id="tabs"></nav><section class="intro"><span id="kicker"></span><h1 id="name"></h1><p id="desc"></p></section><section class="pair" id="pair" data-phase="idle"><div class="wrap left"><article class="card leftCard"><div class="material" id="lm"></div><div class="shade"></div><span class="role" id="lr"></span><div class="copy"><span id="lk"></span><strong id="lt"></strong><small id="lx"></small></div></article></div><div class="bridge"><div class="conn" id="conn"></div><div class="junction"></div><div class="bridgeLabel" id="bl"></div></div><div class="wrap right"><article class="card rightCard"><div class="material" id="rm"></div><div class="shade"></div><span class="role" id="rr"></span><div class="copy"><span id="rk"></span><strong id="rt"></strong><small id="rx"></small></div></article></div></section><div class="controls"><div class="claims"><button data-claim="matching" class="active">MATCHING CLAIM</button><button data-claim="other">OTHER CLAIM</button></div><button id="reset">RESET</button><button class="run" id="run">TEST RELATIONSHIP</button></div><div class="result" id="result">TWO DISTINCT OBJECTS · RELATIONSHIP UNRESOLVED</div><div class="dots" id="dots"></div><div class="law" id="law"></div><div class="truth" id="truth"></div></main><script>const E={city:{label:'CITY',name:'REGISTERED CITY PASSAGE',kicker:'GATINEAU · TERRITORY EDITION',desc:'Member credential and destination credential must register before the route can continue.',theme:'city',l:['CARD A · MEMBER','LOCAL / EXTERNAL CLAIM','Member Credential','Interrupted route'],r:['CARD B · DESTINATION','TERRITORY RULE','Gatineau Field','Corridor rule'],bridge:'ROUTE GAP',law:'APPROACH → COMPARE → REGISTER → ROUTE CONTINUES',truth:'Conceptual territory geometry · not an operational transit map.',lm:'<div class="grid"></div><i class="route"></i>',rm:'<div class="grid"></div><i class="route"></i>',conn:'<div class="cityConn"></div>'},service:{label:'SERVICE',name:'SERVICE REGISTER',kicker:'BENIN · SERVICE-SEQUENCE EDITION',desc:'Two cards carry complementary parts of one service sequence.',theme:'service',l:['CARD A · MEMBER','SERVICE CLAIM','Member Service Key','Steps 01–02'],r:['CARD B · CONTEXT','SERVICE RULE','Service Context','Steps 03–04'],bridge:'MISSING SERVICE STEP',law:'CLAIM → SERVICE → REGISTER → CONNECT',truth:'Archive-derived service logic · not a current official telecom procedure.',lm:'<div class="steps"><i>01</i><i>02</i><i class="miss">—</i><i>04</i></div>',rm:'<div class="steps"><i>01</i><i class="miss">—</i><i>03</i><i>04</i></div>',conn:'<div class="serviceConn"><i></i><i></i><i></i></div>'},signal:{label:'SIGNAL',name:'SIGNAL PORTRAIT',kicker:'NIGERIA · RELAY EDITION',desc:'The signal only crosses when claim and relay counterpart align.',theme:'signal',l:['CARD A · MEMBER','LINK CLAIM','Signal Credential','Claim seeks relay'],r:['CARD B · RELAY','INFRASTRUCTURE RULE','Relay Core','Carrying capacity'],bridge:'SIGNAL GAP',law:'CLAIM → RELAY ALIGN → ZERO RESIDUAL → SIGNAL CONTINUES',truth:'Archive-derived infrastructure portrait · not an official technical diagram.',lm:'<div class="tower"></div>',rm:'<div class="tower"></div>',conn:'<div class="signalConn"></div>'},frida:{label:'FRIDA',name:'TRACE SYSTEM',kicker:'FRIDA KAHLO · COYOACÁN',desc:'A memory claim meets an archive counterpart; the trace exists between them.',theme:'frida',l:['CARD A · MEMORY CLAIM','CULTURAL FIGURE','Frida Kahlo','Portrait · 1932'],r:['CARD B · ARCHIVE','COYOACÁN','Casa Azul','Documented place trace'],bridge:'TRACE SEAM',law:'TRACE → ALIGN → REGISTER → MEMORY CONTINUES',truth:'Real photographic traces · conceptual edition · no museum affiliation.',lm:'<img src="https://upload.wikimedia.org/wikipedia/commons/c/c0/Guillermo_Kahlo%2C_Frida_Kahlo%2C_1932.jpg" alt="Frida Kahlo">',rm:'<img src="https://upload.wikimedia.org/wikipedia/commons/8/88/La_Casa_Azul_%28The_Blue_House%29%2C_better_known_as_the_Frida_Kahlo_Museum%2C_located_in_the_Coyoac%C3%A1n_neighborhood_of_Mexico_City.jpg" alt="Casa Azul">',conn:'<div class="fridaConn"></div>'},food:{label:'FOOD',name:'EDIBLE PASSAGE',kicker:'TOYAMA · MASU NO SUSHI',desc:'Food memory and food context stay separate until pressure registers across the gap.',theme:'food',l:['CARD A · FOOD MEMORY','REGIONAL CLAIM','Toyama Memory Key','Pressed / wrapped state'],r:['CARD B · FOOD CONTEXT','MASU NO SUSHI','Edible Counterpart','Reveal context'],bridge:'PRESSURE REGISTER',law:'PRESS → ALIGN → REGISTER → RELEASE → UNFOLD → REVEAL',truth:'Real food photography · conceptual credential · no producer affiliation.',lm:'<img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Masunosushi.JPG?width=1600" alt="Wrapped Masu no sushi"><div class="pressure"></div>',rm:'<img src="https://upload.wikimedia.org/wikipedia/commons/7/7f/Masu_no_sushi_4_by_hirotomo.jpg" alt="Masu no sushi"><div class="pressure"></div>',conn:'<div class="foodConn"></div>'},textile:{label:'TEXTILE',name:'WOVEN REGISTER',kicker:'ASANTE · BONWIRE',desc:'Woven strips terminate at both facing edges; registration lets them interlace across the gap.',theme:'textile',l:['CARD A · WOVEN CLAIM','TEXTILE MEMORY','Asante Credential','Strip terminates at edge'],r:['CARD B · WEAVING CONTEXT','BONWIRE','Woven Counterpart','Corresponding strip'],bridge:'UNREGISTERED JOIN',law:'STRIP → ALIGN → INTERLACE → REGISTER → JOIN → CONTINUE',truth:'Real Asante textile imagery · no invented pattern meaning.',lm:'<div class="strip"></div>',rm:'<div class="strip"></div>',conn:'<div class="textileConn">'+Array.from({length:14},()=>'<i></i>').join('')+'</div>'}};let current='city',claim='matching',busy=false;const pair=document.getElementById('pair'),tabs=document.getElementById('tabs'),result=document.getElementById('result'),dots=document.getElementById('dots');const wait=ms=>new Promise(r=>setTimeout(r,ms));function status(n){dots.innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}function renderTabs(){tabs.innerHTML=Object.entries(E).map(([k,v])=>`<button data-e="${k}" class="${k===current?'active':''}">${v.label}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.e;reset();render()})}function render(){const e=E[current];pair.className='pair '+e.theme;document.getElementById('name').textContent=e.name;document.getElementById('kicker').textContent=e.kicker;document.getElementById('desc').textContent=e.desc;['l','r'].forEach((s,i)=>{const p=i?'r':'l';document.getElementById(p+'r').textContent=e[s][0];document.getElementById(p+'k').textContent=e[s][1];document.getElementById(p+'t').textContent=e[s][2];document.getElementById(p+'x').textContent=e[s][3]});document.getElementById('lm').innerHTML=e.lm;document.getElementById('rm').innerHTML=e.rm;document.getElementById('conn').innerHTML=e.conn;document.getElementById('bl').textContent=e.bridge;document.getElementById('law').textContent='PAIR LAW · '+e.law;document.getElementById('truth').textContent=e.truth;renderTabs();status(0)}function reset(){busy=false;pair.dataset.phase='idle';pair.classList.remove('rejected');result.className='result';result.textContent='TWO DISTINCT OBJECTS · RELATIONSHIP UNRESOLVED';status(0);document.getElementById('run').disabled=false}async function run(){if(busy)return;busy=true;const b=document.getElementById('run');b.disabled=true;pair.dataset.phase='approach';result.textContent='APPROACHING COUNTERPART';status(1);await wait(480);result.textContent='COMPARING CLAIM × COUNTERPART';status(2);await wait(500);if(claim==='other'){pair.dataset.phase='idle';pair.classList.add('rejected');result.className='result bad';result.textContent='RELATIONSHIP RESISTS · BOTH CARDS REMAIN VALID';status(3);await wait(450);pair.classList.remove('rejected');busy=false;b.disabled=false;return}result.textContent='REGISTERING RELATIONSHIP';status(3);await wait(520);pair.dataset.phase='registered';result.className='result ok';result.textContent='RELATIONSHIP REGISTERED · CONNECTION CONTINUES';status(5);busy=false;b.disabled=false}document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{claim=b.dataset.claim;document.querySelectorAll('[data-claim]').forEach(x=>x.classList.toggle('active',x===b));reset()});document.getElementById('run').onclick=run;document.getElementById('reset').onclick=reset;render();</script></body></html>

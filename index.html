<body>
<main class="shell">

<script>
const E={
city:{label:'CITY',name:'REGISTERED CITY PASSAGE',kicker:'GATINEAU · TERRITORY EDITION',desc:'Member credential and destination credential must register before the route can continue.',theme:'city',l:['MEMBER CREDENTIAL','LOCAL / EXTERNAL CLAIM','Member Key','Interrupted route'],r:['DESTINATION CREDENTIAL','TERRITORY RULE','Gatineau Field','Corridor rule'],bridge:'ROUTE GAP',law:'APPROACH → COMPARE → REGISTER → ROUTE CONTINUES',truth:'Conceptual territory geometry · not an operational transit map.',lm:'<div class="grid"></div><i class="route"></i>',rm:'<div class="grid"></div><i class="route"></i>',conn:'<div class="cityConn"></div>'},

};
let edition='city',claim='matching',busy=false,dragX=0;const $=s=>document.querySelector(s),pair=$('#pair'),left=$('.slot.left'),tabs=$('#tabs'),result=$('#result');
function render(){const e=E[edition];pair.className='pair '+e.theme;pair.dataset.phase='idle';pair.style.removeProperty('--drag');pair.classList.remove('drag-mode');dragX=0;$('#kicker').textContent=e.kicker;$('#name').textContent=e.name;$('#desc').textContent=e.desc;$('#lr').textContent=e.l[0];$('#lk').textContent=e.l[1];$('#lt').textContent=e.l[2];$('#lx').textContent=e.l[3];$('#rr').textContent=e.r[0];$('#rk').textContent=e.r[1];$('#rt').textContent=e.r[2];$('#rx').textContent=e.r[3];$('#bl').textContent=e.bridge;$('#law').textContent=e.law;$('#truth').textContent=e.truth;$('#lm').innerHTML=e.lm;$('#rm').innerHTML=e.rm;$('#conn').innerHTML=e.conn;result.className='result';result.textContent='TWO DISTINCT OBJECTS · RELATIONSHIP UNRESOLVED';$('#dots').innerHTML='<i></i><i></i><i></i><i></i>';tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.edition===edition));}
Object.entries(E).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.label;b.dataset.edition=k;b.onclick=()=>{if(!busy){edition=k;render()}};tabs.appendChild(b)});
document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{if(busy)return;claim=b.dataset.claim;document.querySelectorAll('[data-claim]').forEach(x=>x.classList.toggle('active',x===b));reset()});
const wait=ms=>new Promise(r=>setTimeout(r,ms));function dot(n){[...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i<=n))}
async function run(){if(busy)return;busy=true;$('#run').disabled=true;pair.classList.remove('drag-mode');pair.dataset.phase='approach';result.textContent='APPROACH · COMPARING CLAIM TO COUNTERPART';dot(0);await wait(650);if(claim==='other'){pair.dataset.phase='rejected';result.className='result bad';result.textContent='RELATIONSHIP DOES NOT REGISTER · BOTH CREDENTIALS REMAIN VALID';dot(1);await wait(520);pair.dataset.phase='idle';busy=false;$('#run').disabled=false;return}result.textContent='REGISTERING RELATIONSHIP ACROSS THE GAP';dot(1);await wait(650);pair.dataset.phase='registered';dot(3);result.className='result ok';result.textContent='RELATIONSHIP REGISTERED · CONTINUATION NOW EXISTS BETWEEN CARD A AND CARD B';await wait(800);busy=false;$('#run').disabled=false}
function reset(){busy=false;$('#run').disabled=false;render();document.querySelectorAll('[data-claim]').forEach(x=>x.classList.toggle('active',x.dataset.claim===claim))}$('#run').onclick=run;$('#reset').onclick=reset;
let sx=0,start=0,dragging=false;$('#leftCard').addEventListener('pointerdown',e=>{if(innerWidth<901||busy)return;dragging=true;sx=e.clientX;start=dragX;left.classList.add('dragging');left.setPointerCapture(e.pointerId);pair.classList.add('drag-mode')});$('#leftCard').addEventListener('pointermove',e=>{if(!dragging)return;dragX=Math.max(0,Math.min(118,start+e.clientX-sx));pair.style.setProperty('--drag',dragX+'px');if(dragX>45){pair.dataset.phase='approach';result.textContent='APPROACH · RELEASE NEAR THE COUNTERPART TO TEST'}else{pair.dataset.phase='idle'}});function endDrag(){if(!dragging)return;dragging=false;left.classList.remove('dragging');if(dragX>82){run()}else{dragX=0;pair.style.setProperty('--drag','0px');pair.dataset.phase='idle';result.textContent='TWO DISTINCT OBJECTS · RELATIONSHIP UNRESOLVED'}}$('#leftCard').addEventListener('pointerup',endDrag);$('#leftCard').addEventListener('pointercancel',endDrag);render();

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>RELATIONAL KEY — Three.js Signature POC</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="eyebrow">DAY 17 · THREE.JS SIGNATURE PROOF</div><h1>RELATIONAL KEY</h1></div>
      <button id="debugToggle" class="ghost">DEBUG</button>
    </header>
    <section class="intro">
      <p>Your membership doesn’t grant access by itself. <strong>The relationship does.</strong></p>
      <span>A valid relationship completes the path.</span>
    </section>
    <section class="stage" aria-label="Relational Key interaction">
      <canvas id="scene"></canvas>
      <div id="phase" class="phase">GRAB THE CREDENTIAL</div>
      <div id="debug" class="debug" hidden></div>
      <div id="result" class="result" hidden></div>
    </section>
    <div class="dock">
      <div class="scenario" role="group" aria-label="Membership tier">
        <button data-scenario="family" class="active">FAMILY PLUS</button>
        <button data-scenario="standard">STANDARD</button>
      </div>
      <button id="reset">TRY AGAIN</button>
      <button id="auto" class="quiet">TEST RELATIONSHIP</button>
    </div>
    <footer>GRAB <b>→</b> PROXIMITY <b>→</b> COMPARE <b>→</b> SNAP / RESIST <b>→</b> CONTINUE</footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
